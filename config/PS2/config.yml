# Splat config for SLES52569 — Spyro: A Hero's Tail (PS2 PAL)
# Place the ELF at orig/PS2/SLES_525.69 before running configure.
name: Spyro A Hero's Tail PAL PS2
sha1: 6202adb1bd0d1b0b6d7151b4ee42d20b1d07583b

options:
  basename: SLES_525.69
  target_path: orig/PS2/SLES_525.69
  base_path: ../..
  platform: ps2
  compiler: EEGCC

  gp_value: 0x004FB9F0
  ld_gp_expression: main_SDATA_START + 0xBF0

  # Output paths (relative to base_path)
  asm_path: build/PS2/asm
  src_path: src/PS2
  build_path: build/PS2/obj

  # Assembly options
  generate_asm_macros_files: True
  named_regs_for_c_funcs: False
  find_file_boundaries: False
  disasm_unknown: True
  make_full_disasm_for_code: True

  # Rodata options
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 0
  suggestion_rodata_section_start: True
  pair_rodata_to_text: False
  migrate_rodata_to_functions: True

  # Auto-generate undefined functions and symbols
  # create_undefined_funcs_auto: True
  undefined_funcs_auto_path: config/PS2/undefined_funcs_auto.txt
  # create_undefined_syms_auto: True
  undefined_syms_auto_path: config/PS2/undefined_syms_auto.txt

  # Manually defined symbols
  symbol_addrs_path: config/PS2/symbols.txt
  ld_script_path: build/PS2/ldscript.ld

  o_as_suffix: True

  # ELF sections
  # section_order: [".text", ".vutext", ".noover", ".rodata", ".gcc_except_table", ".over", ".data", ".lit4", ".sdata", ".sbss", ".bss"]
  # auto_link_sections: [".rodata", ".data", ".lit4", ".sdata", ".sbss", ".bss"]

  section_order:
    - .text
    - .vutext
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

  auto_link_sections:
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

  # Linker script options
  subalign: 8

segments:
  # Use `python configure.py -v PS2` after placing orig/PS2/SLES_525.69
  # to run splat. Addresses here are file offset / vram pairs.
  # Example subsegments based on debug info ordering — addresses are placeholders.
  #
  # From debug info:
  #   _start (crt0) @ 0x00100008 → file offset ~0x1008, vram 0x100008
  #   First game code (PreSE.cpp) @ 0x00100200
  - name: main
    type: code
    start: 0x1000
    vram: 0x100000
    bss_size: 0x3FBD7 # should be 0x3FVB9 - Size of .bss + .sbss
    subsegments:

      # Uses File Offsets

      # CRT0 startup
      - [0x1008, asmtu, EngineX/PS2/crt0]
